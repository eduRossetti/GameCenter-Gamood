
services:
  db:
    image: postgres:15-alpine # Versão leve do postgres
    restart: always # Mantém o banco sempre ativo localmente
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gamood_pgdata_v2:/var/lib/postgresql/data # Persistência isolada deste banco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gamood_pgdata_v2: # Volume próprio para este banco; mantém o volume antigo intacto
